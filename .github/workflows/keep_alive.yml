name: Wake Up Streamlit App

on:
  schedule:
    # 每天台灣時間早上 8 點執行 (UTC 00:00)
    - cron: '0 0 * * *'
  # 允許手動點擊執行，方便測試
  workflow_dispatch:

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Send Request to Streamlit
        run: |
          curl -I https://你的專案連結.streamlit.app
